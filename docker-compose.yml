version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: clinical_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: clinical_password
      MYSQL_DATABASE: healthcare_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: 
      context: ./main_backend
    container_name: clinical_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=clinical_password
      - DB_NAME=healthcare_db
      - PORT=5000
      - JWT_SECRET=clinical_super_secret_jwt_key_2026
      - AI_SERVICE_URL=http://ai_service:8000
    depends_on:
      - db
      - ai_service

  ai_service:
    build:
      context: ./ai_service
    container_name: clinical_ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend_app
      # args:
      #   - VITE_API_URL=http://YOUR_SERVER_IP:5000/api
    container_name: clinical_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
